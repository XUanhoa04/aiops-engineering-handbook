# AIOps Engineering Handbook — MkDocs site (GitHub Pages)
site_name: AIOps Engineering Handbook
site_description: Production-grade AIOps handbook — observability to remediation (Vietnamese + English)
site_author: XUanhoa04
site_url: https://xuanhoa04.github.io/aiops-engineering-handbook/

repo_name: XUanhoa04/aiops-engineering-handbook
repo_url: https://github.com/XUanhoa04/aiops-engineering-handbook
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  includes/
  /README.md
  /vi/11-llm-agent/
  /vi/12-remediation/
  /vi/13-production/
  /vi/13-bigtech-aiops/
  /vi/14-bigtech-aiops/
  /vi/15-ecommerce-banking/
  /vi/16-famous-incidents/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Convert GitHub [!NOTE]/[!TIP]/… alerts → Material colored admonitions at build time
# (source .md files stay GFM-compatible for GitHub raw viewing)
hooks:
  - hooks/gh_callouts.py

plugins:
  - search:
      lang:
        - en
        - vi

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/XUanhoa04/aiops-engineering-handbook
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-zoom.js

# Explicit nav — keeps dual-language tabs clear
